# /etc/skel/.config/kitty/kitty.conf
# Aether OS Official Terminal Configuration - Glassmorphism & Cyberpunk Palette

# --- Typography ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
disable_ligatures never

# --- Window Layout & Glassmorphism ---
window_padding_width 15
hide_window_decorations yes
confirm_os_window_close 0

# Set opacity to 70% to allow Hyprland's Gaussian blur to show through
background_opacity 0.70
background_blur 1

# --- Aether OS Color Palette ---
# Background and Foreground
background #0a0a0f
foreground #f8f8f2

# Cursor and Selection (Rose and Orange accents)
cursor #f43f5e
cursor_text_color background
selection_background #f47b51
selection_foreground #0a0a0f

# The 16 Terminal Colors
# Black
color0 #1a1a24
color8 #4d4d5e

# Red / Rose
color1 #f43f5e
color9 #ff6b8b

# Green / Emerald
color2  #10b981
color10 #34d399

# Yellow / Amber
color3  #f59e0b
color11 #fbbf24

# Blue
color4  #3b82f6
color12 #60a5fa

# Magenta / Purple
color5  #8b5cf6
color13 #a78bfa

# Cyan
color6  #06b6d4
color14 #22d3ee

# White / Gray
color7  #e2e2e2
color15 #f8f8f2
