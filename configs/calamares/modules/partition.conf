# /etc/calamares/modules/partition.conf - AetherOS Partitioning Engine
---
efiSystemPartition:     "/boot/efi"
efiSystemPartitionSize: 512M
efiSystemPartitionName: EFI

# Force the installer to use Btrfs
userFileSystemType:     "btrfs"
defaultFileSystemType:  "btrfs"

# Modern systems should always default to GPT
defaultPartitionTableType: gpt

# Allow the user to select swap options (none, small, suspend)
initialPartitioningChoice: none
initialSwapChoice: none

# Always align partitions to 1MiB for SSD/NVMe performance
partitionAlignment: 1MiB
