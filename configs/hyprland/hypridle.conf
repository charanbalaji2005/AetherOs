# ~/.config/hypr/hypridle.conf
# AetherOS Automated Tiered Idle & Power Management Daemon

general {
    # Avoid starting multiple instances of hyprlock
    lock_cmd = pidof hyprlock || hyprlock
    
    # Lock the screen before the system goes to sleep
    before_sleep_cmd = loginctl lock-session
    
    # Force the display to turn on when waking up
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Tier 1: Dim screen after 2.5 minutes of inactivity
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10 2>/dev/null || true
    on-resume = brightnessctl -r 2>/dev/null || true
}

# Tier 2: Lock the screen after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Tier 3: Turn off display after 5.5 minutes
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Tier 4: Suspend system after 15 minutes
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
