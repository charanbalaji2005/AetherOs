# /etc/calamares/modules/bootloader.conf
# AetherOS Dual-Boot & Unified EFI Bootloader Configuration
---
efiBootLoader: "grub"
installEpTree: true

# GRUB EFI target configuration
grubInstall: "grub2-install"
grubMkconfig: "grub2-mkconfig"
grubCfgPath: "/boot/grub2/grub.cfg"
efiBootMgr: "efibootmgr"

# Preserve existing OS entries (e.g. Windows Boot Manager) in NVRAM/ESP
installToEsp: true
