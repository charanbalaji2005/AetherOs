# /etc/calamares/modules/mount.conf - AetherOS Btrfs Subvolume & Snapshot Architecture
---
# 1. Define the isolated Btrfs subvolumes
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /.snapshots
      subvolume: /@snapshots
    - mountPoint: /var/log
      subvolume: /@log
    - mountPoint: /var/cache
      subvolume: /@cache

# If the user selects a swapfile during install, place it here
btrfsSwapSubvol: /@swap

# 2. Inject performance and compression flags
mountOptions:
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:1, space_cache=v2, ssd, discard=async ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: ext4
      options: [ defaults, noatime ]
    - filesystem: vfat
      options: [ defaults, dmask=0022, fmask=0133 ]
