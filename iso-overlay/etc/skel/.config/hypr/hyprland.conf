# /etc/skel/.config/hypr/hyprland.conf
# Aether OS Master Hyprland Configuration
# Glassmorphism, Cyberpunk Aesthetics, Fluid Physics & Hardware Acceleration

# ---------------------------------------------------------
# 1. Hardware & Monitor Setup
# ---------------------------------------------------------
monitor=Virtual-1, 1920x1080@60, 0x0, 1
monitor=Virtual-2, 1920x1080@60, 0x0, 1
monitor=, preferred, auto, 1
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = WLR_NO_HARDWARE_CURSORS,1 # Critical for VMware and Nvidia Wayland
env = WLR_RENDERER_ALLOW_SOFTWARE,1 # Fallback for software rendering on hypervisors
env = LIBGL_ALWAYS_SOFTWARE,0
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11,*
env = MOZ_ENABLE_WAYLAND,1
env = OZONE_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ---------------------------------------------------------
# 2. Autostart Core Daemons & Services
# ---------------------------------------------------------
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = (/usr/libexec/xdg-desktop-portal-hyprland || /usr/lib/xdg-desktop-portal-hyprland) &
exec-once = (/usr/libexec/xdg-desktop-portal || /usr/lib/xdg-desktop-portal) &
exec-once = waybar
exec-once = swww-daemon || (swaybg -i /usr/share/backgrounds/aetheros/sunset_mountains.png -m fill || true)
exec-once = swaync
exec-once = swayosd-server &
exec-once = kanshi &
exec-once = nm-applet --indicator &
exec-once = blueman-applet &
exec-once = udiskie &
exec-once = /usr/libexec/polkit-kde-authentication-agent-1 || /usr/libexec/hyprpolkitagent || /usr/libexec/polkit-gnome-authentication-agent-1 &
exec-once = hypridle &
exec-once = wl-paste --type text --watch cliphist store &
exec-once = wl-paste --type image --watch cliphist store &
exec-once = /usr/bin/VBoxClient --all 2>/dev/null || true
exec-once = /usr/bin/spice-vdagent 2>/dev/null || true
exec-once = aether-update-engine &

# ---------------------------------------------------------
# 3. Layout, Gaps, and Borders
# ---------------------------------------------------------
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    
    # Vibrant neon gradient borders using Aether OS palette
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    
    layout = dwindle
    resize_on_border = true
}

# ---------------------------------------------------------
# 4. Glassmorphism (Blur, Shadows, Opacity)
# ---------------------------------------------------------
decoration {
    rounding = 12
    
    # Translucent glass look
    active_opacity = 0.90
    inactive_opacity = 0.75
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 8              # Radius of the blur
        passes = 3            # Higher passes = smooth frosted glass
        new_optimizations = true
        ignore_opacity = true # Blurs behind translucent windows
        xray = false
    }

    # Modern shadow configuration
    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

# ---------------------------------------------------------
# 5. Fluid Physics & Animations
# ---------------------------------------------------------
animations {
    enabled = yes

    # Custom bezier curve for a springy, kinetic feel
    bezier = overshot, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 5, overshot
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, overshot, slide
    animation = specialWorkspace, 1, 5, overshot, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    vrr = 1
    focus_on_activate = true
}

# ---------------------------------------------------------
# 6. Apple-Tier 1:1 Trackpad Gestures
# ---------------------------------------------------------
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new = true
}

# ---------------------------------------------------------
# 7. Keybindings
# ---------------------------------------------------------
$mainMod = SUPER

# Application Launchers
bind = $mainMod, Return, exec, kitty
bind = $mainMod, Space, exec, aether-software || fuzzel || wofi --show drun
bind = $mainMod, W, exec, firefox
bind = $mainMod, E, exec, aether-files || thunar
bind = $mainMod, S, exec, aether-settings
bind = $mainMod, D, exec, aether-driver-manager
bind = $mainMod, X, exec, aether-powermenu
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# Quake-Style Scratchpad (Global AI Agent & Visor Overlay)
bind = $mainMod, Grave, togglespecialworkspace, ai_agent
bind = $mainMod SHIFT, Grave, movetoworkspace, special:ai_agent

# Window Management
bind = $mainMod, Q, killactive, 
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, togglefloating, 
bind = $mainMod, J, togglesplit, # dwindle

# Focus Management
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces (Switch via SUPER + 1..9, 0)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move Active Window to Workspace (SUPER + SHIFT + 1..9, 0)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mouse Workspace Scrolling & Window Drag
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizeactive

# --- Vim-Style Resize Submap ---
bind = $mainMod, R, submap, resize
submap = resize
binde = , right, resizeactive, 20 0
binde = , left, resizeactive, -20 0
binde = , up, resizeactive, 0 -20
binde = , down, resizeactive, 0 20
bind = , escape, submap, reset
bind = , Return, submap, reset
submap = reset

# Hardware Audio & Media Keys (with SwayOSD visual HUD)
bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle || wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness raise || brightnessctl set 5%+
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness lower || brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , switch:on:Lid Switch, exec, /usr/local/bin/aether-lid-handler
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on

# ---------------------------------------------------------
# 8. Smart Window Rules V2 & Dynamic Dim-Around
# ---------------------------------------------------------
windowrulev2 = opacity 1.0 0.70, class:^(kitty)$
windowrulev2 = blur, class:^(kitty)$
windowrulev2 = opacity 0.95 0.85, class:^(firefox)$

# Quake-Style AI Agent Visor Overlay
windowrulev2 = workspace special:ai_agent, class:^(aether-ai-agent)$
windowrulev2 = float, class:^(aether-ai-agent)$
windowrulev2 = size 40% 60%, class:^(aether-ai-agent)$
windowrulev2 = center, class:^(aether-ai-agent)$

# Tauri System Apps
windowrulev2 = float, class:^(aether-.*)$
windowrulev2 = center, class:^(aether-.*)$
windowrulev2 = opacity 0.95 0.90, class:^(aether-.*)$

# Dynamic Dim-Around for Security Modals & Polkit
windowrulev2 = dimaround, class:^(polkit-.*)$
windowrulev2 = dimaround, class:^(aether-security-center)$

# Video Picture-in-Picture Pop-out
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = keepaspectratio, title:^(Picture-in-Picture)$

# Power Menu Fullscreen Overlay
windowrulev2 = fullscreen, class:^(aether-powermenu)$
windowrulev2 = pin, class:^(aether-powermenu)$

# Layer Rules for Waybar, SwayNC & SwayOSD
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = ignorealpha 0.2, waybar
layerrule = blur, swaync-control-center
layerrule = ignorezero, swaync-control-center
layerrule = blur, swaync-notification-window
layerrule = ignorezero, swaync-notification-window
layerrule = blur, swayosd
layerrule = ignorezero, swayosd
