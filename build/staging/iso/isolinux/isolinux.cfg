default vesamenu.c32
timeout 10
totaltimeout 10

menu title AetherOS Live Boot Menu
menu color title    * #ffffffff #00000000 none
menu color border   * #ff9d4edd #00000000 none
menu color sel      * #ff56d4dd #ff161b22 none

label live
  menu label ^Start AetherOS 1.0 (Live Desktop - Fast Boot)
  menu default
  kernel vmlinuz
  append initrd=initrd.img root=live:CDLABEL=AETHEROS rd.live.image rw quiet splash loglevel=3 rd.systemd.show_status=auto rd.udev.log_level=3 vt.global_cursor_default=0 udev.log_priority=3 mitigations=off fastboot fsck.mode=skip bgrt.enable=1 selinux=0 enforcing=0

label basic
  menu label Start AetherOS 1.0 (Basic Graphics Mode)
  kernel vmlinuz
  append initrd=initrd.img root=live:CDLABEL=AETHEROS rd.live.image rw nomodeset quiet selinux=0 enforcing=0
