autogenerated = 0

# AetherOS Official Hyprland Desktop Environment Configuration
# High Performance, Glassmorphism, Cyberpunk Aesthetics & Zero VM Stutter

# --- Monitors & Dynamic Palette Source ---
monitor=,preferred,auto,1
source = ~/.config/hypr/monitors.conf
source = ~/.cache/wal/colors-hyprland.conf

# --- Autostart Daemons & Services ---
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = aether-splash &
exec-once = aether-desktop-overlay --server-only &
exec-once = (/usr/libexec/xdg-desktop-portal-hyprland || /usr/lib/xdg-desktop-portal-hyprland) &
exec-once = (/usr/libexec/xdg-desktop-portal || /usr/lib/xdg-desktop-portal) &
exec-once = waybar
exec-once = swaync
exec-once = udiskie &
exec-once = swaybg -i /usr/share/backgrounds/aetheros/sunset_mountains.png -m fill || swaybg -i /usr/share/backgrounds/aetheros/default.png -m fill
exec-once = /usr/libexec/polkit-kde-authentication-agent-1 || /usr/libexec/hyprpolkitagent || /usr/libexec/polkit-gnome-authentication-agent-1 &
exec-once = hypridle &
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = nm-applet --indicator &
exec-once = blueman-applet &
exec-once = /usr/bin/VBoxClient --all 2>/dev/null || true
exec-once = /usr/bin/spice-vdagent 2>/dev/null || true

# --- Environment Variables: Maximum GPU Acceleration & Zero Latency ---
env = LIBGL_ALWAYS_SOFTWARE,0
env = MESA_LOADER_DRIVER_OVERRIDE,
env = WLR_DRM_NO_ATOMIC,1
env = AQ_NO_MODIFIERS,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt5ct
env = GDK_BACKEND,wayland,x11,*
env = MOZ_ENABLE_WAYLAND,1
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# --- Look & Feel: Fedora Workstation with AetherOS Cyber-Glass Polish ---
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(00f0ffee) rgba(a855f7ee) 45deg
    col.inactive_border = rgba(255, 255, 255, 0.12)
    layout = dwindle
    resize_on_border = true
}

# --- Decoration & Performance: Butter-Smooth 60 FPS in VM & Bare Metal ---
decoration {
    rounding = 10
    blur {
        enabled = false
    }
    shadow {
        enabled = true
        range = 15
        render_power = 2
        color = rgba(0, 0, 0, 0.45)
    }
}

# --- Renderer & KMS ---
render {
    explicit_sync = 0
    explicit_sync_kms = 0
    direct_scanout = false
    expand_undersized_textures = true
}

# --- Fluid Physics Animations ---
animations {
    enabled = true
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    animation = windows, 1, 4, overshot, popin 80%
    animation = windowsOut, 1, 3, easeOutExpo, popin 80%
    animation = fade, 1, 3, easeOutExpo
    animation = workspaces, 1, 4, overshot, slide
    animation = specialWorkspace, 1, 4, overshot, slidevert
    animation = border, 1, 3, easeOutExpo
}

dwindle {
    pseudotile = true
    preserve_split = true
}

input {
    kb_layout = us
    kb_model = pc105
    kb_variant =
    kb_options =
    repeat_rate = 50
    repeat_delay = 240
    numlock_by_default = true
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    sensitivity = 0.0
}

# --- Hardware Cursor: Zero-Lag Mouse Rendering ---
cursor {
    no_hardware_cursors = false
    enable_hyprcursor = true
    sync_gsettings_theme = true
    no_warps = false
    min_refresh_rate = 60
}

# --- Misc Settings: Optimized Performance ---
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    vrr = 1
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    enable_swallow = false
}

gestures {
    workspace_swipe = true
}

# --- Apps Definition ---
$terminal = kitty
$menu = rofi -show drun -theme ~/.config/rofi/aether-menu.rasi || rofi -show drun || wofi --show drun
$fileManager = aether-files
$browser = firefox
$settings = aether-settings
$lock = hyprlock
$power = aether-powermenu
$screenshot = aether-screenshot

# --- Keybinds ---
$mod = SUPER

# Applications
bind = $mod, Return, exec, $terminal
bind = $mod, T, exec, $terminal
bind = $mod, Space, exec, $menu
bind = $mod, D, exec, $menu
bind = $mod SHIFT, D, exec, rofi -show run -theme ~/.config/rofi/aether-menu.rasi || rofi -show run
bind = $mod, E, exec, $fileManager
bind = $mod, B, exec, $browser
bind = $mod, I, exec, $settings
bind = $mod, A, exec, aether-ai
bind = $mod, L, exec, $lock
bind = $mod, Escape, exec, $power
bind = $mod, Backspace, exec, $power

# Screenshots
bind = , Print, exec, $screenshot
bind = $mod, S, exec, $screenshot
bind = SHIFT, Print, exec, $screenshot full
bind = $mod SHIFT, S, exec, $screenshot full

# Notifications & Control Center
bind = $mod, N, exec, swaync-client -t -sw

# Clipboard History
bind = $mod, V, exec, cliphist list | rofi -dmenu -theme ~/.config/rofi/aether-menu.rasi -p "Clipboard" | cliphist decode | wl-copy || cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mod SHIFT, V, exec, cliphist list | wofi --dmenu --prompt "Clipboard History" | cliphist decode | wl-copy

# Window Management
bind = $mod, Q, killactive,
bind = $mod, C, killactive,
bind = $mod, W, killactive,
bind = ALT, F4, killactive,
bind = $mod, F, fullscreen, 0
bind = $mod, M, fullscreen, 1
bind = $mod, V, togglefloating,
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,
bind = $mod, Tab, cyclenext,
bind = $mod, Tab, bringactivetotop,

# Focus Navigation
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u

# Moving Windows
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move Window to Workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Special Workspace (Scratchpad Dropdown)
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

# Resize Submap (Vim-style mode)
bind = $mod, R, submap, resize
submap = resize
binde = , right, resizeactive, 20 0
binde = , left, resizeactive, -20 0
binde = , up, resizeactive, 0 -20
binde = , down, resizeactive, 0 20
binde = , l, resizeactive, 20 0
binde = , h, resizeactive, -20 0
binde = , k, resizeactive, 0 -20
binde = , j, resizeactive, 0 20
bind = , escape, submap, reset
bind = , Return, submap, reset
submap = reset

# Mouse Workspace Scrolling & Window Drag
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Hardware Audio & Media Keys
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , switch:on:Lid Switch, exec, /usr/local/bin/aether-lid-handler
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on

# --- Window Rules & Glass Accents ---
windowrulev2 = opacity 0.85 0.70, class:^(kitty)$
windowrulev2 = blur, class:^(kitty)$
windowrulev2 = animation popin, class:^(kitty)$
windowrulev2 = opacity 0.95 0.85, class:^(firefox)$
windowrulev2 = float, class:^(thunar)$
windowrulev2 = float, class:^(org.gnome.FileRoller)$
windowrulev2 = float, class:^(org.gnome.Loupe)$
windowrulev2 = workspace 4, class:^(discord)$
windowrulev2 = workspace 5, class:^(Spotify)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, title:^(aether-ai)$
windowrulev2 = size 700 500, title:^(aether-ai)$
windowrulev2 = center, title:^(aether-ai)$
windowrulev2 = float, title:^(AetherOS Splash)$
windowrulev2 = center, title:^(AetherOS Splash)$
windowrulev2 = pin, title:^(AetherOS Splash)$
windowrulev2 = noborder, title:^(AetherOS Splash)$
windowrulev2 = float, title:^(AetherOS Settings)$
windowrulev2 = size 920 620, title:^(AetherOS Settings)$
windowrulev2 = center, title:^(AetherOS Settings)$
windowrulev2 = float, class:^(aether-powermenu)$
windowrulev2 = fullscreen, class:^(aether-powermenu)$
windowrulev2 = pin, class:^(aether-powermenu)$
windowrulev2 = noborder, class:^(aether-powermenu)$

# Polkit Authentication Agent (Frosted Glass & Dim Surround)
windowrulev2 = float, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrulev2 = center, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrulev2 = opacity 0.85 0.85, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrulev2 = dimaround, class:^(org.kde.polkit-kde-authentication-agent-1)$

# --- Layer Rules: Frosted Glass Desktop Elements ---
layerrule = blur, waybar
layerrule = blur, rofi
layerrule = ignorezero, rofi
layerrule = blur, wofi
layerrule = ignorezero, wofi
layerrule = blur, swaync-control-center
layerrule = blur, swaync-notification-window
layerrule = ignorezero, swaync-control-center
layerrule = ignorezero, swaync-notification-window
layerrule = ignorealpha 0.5, swaync-control-center
layerrule = ignorealpha 0.5, swaync-notification-window
