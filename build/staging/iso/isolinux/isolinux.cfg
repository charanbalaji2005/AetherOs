default vesamenu.c32
timeout 60

menu title AetherOS 1.0 Live

label live
  menu label ^Start AetherOS 1.0 (Hyprland Desktop)
  menu default
  kernel vmlinuz
  append initrd=initrd.img root=live:CDLABEL=AETHEROS rd.live.image quiet splash

label safe
  menu label Start AetherOS 1.0 (^Basic Graphics)
  kernel vmlinuz
  append initrd=initrd.img root=live:CDLABEL=AETHEROS rd.live.image nomodeset quiet
