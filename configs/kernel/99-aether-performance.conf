# /etc/sysctl.d/99-aether-performance.conf
# AetherOS Kernel & Virtual Memory High-Performance Tuning

# Lower swappiness so the system prioritizes RAM over disk swap
vm.swappiness = 10

# Keep directory and inode cache active longer for instant app launches
vm.vfs_cache_pressure = 50

# Optimize dirty page writebacks to prevent system lockups during large file transfers
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# Increase maximum open file descriptors for heavy multitasking & IDEs
fs.file-max = 2097152

# Network throughput & buffer optimizations
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
