[General]
background=/usr/share/backgrounds/aetheros/default.png
backgroundMode=aspect
blurBackground=true
blurRadius=32

# Typography
fontFamily="Outfit, Segoe UI, Roboto, sans-serif"
fontSize=10
clockFontSize=42
dateFontSize=14

# Color Palette (AetherOS Theme)
accentColor=#56d4dd
accentSecondary=#7cc7ff
cardBgColor=#161b22cc
cardBorderColor=#56d4dd55
textColor=#e6f1f5
textMutedColor=#8b949e
inputBgColor=#0d1117dd
inputBorderColor=#30363d
inputFocusBorderColor=#56d4dd
buttonBgColor=#21262d
buttonHoverColor=#30363d
dangerColor=#f85149

# Layout & Animation
cardWidth=380
cardHeight=460
cardRadius=16
inputRadius=10
enablePulse=true
enableAnimations=true
showSessionSelector=true
showPowerButtons=true
defaultSession=hyprland
