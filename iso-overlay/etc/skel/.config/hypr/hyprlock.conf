# AetherOS Official Hyprlock Configuration
# Exact Pixel-Perfect Match to Modern Cyberpunk-Minimalist Lockscreen

background {
    monitor =
    path = ~/.cache/aether-lockscreen.jpg
    color = rgba(10, 10, 15, 0.85)

    # Frosted glass blur
    blur_passes = 3
    blur_size = 8
    noise = 0.012
    contrast = 0.89
    brightness = 0.82
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

# --- Top Left: MPRIS Media Player Track Info ---
label {
    monitor =
    text = cmd[update:2000] echo "$(playerctl metadata --format '{{ title }} ✪ {{ artist }}' 2>/dev/null || echo 'Aether OS • Wayland')"
    color = rgba(255, 255, 255, 0.85)
    font_size = 13
    font_family = Outfit, "JetBrainsMono Nerd Font", sans-serif
    position = 35, -25
    halign = left
    valign = top
}

# --- Top Right: Layout, Battery & Network Status ---
label {
    monitor =
    text = cmd[update:1000] echo "US  󰌌  󰁹  󰤨"
    color = rgba(255, 255, 255, 0.85)
    font_size = 13
    font_family = Outfit, "JetBrainsMono Nerd Font", sans-serif
    position = -35, -25
    halign = right
    valign = top
}

# --- Center Top: Date (e.g. Tuesday, July 09) ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %B %d')"
    color = rgba(255, 255, 255, 0.85)
    font_size = 20
    font_family = Outfit, "JetBrainsMono Nerd Font", sans-serif
    position = 0, 160
    halign = center
    valign = center
}

# --- Center Top: Massive Clock (e.g. 12:41) ---
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>"
    color = rgba(255, 255, 255, 0.95)
    font_size = 115
    font_family = Outfit, "JetBrainsMono Nerd Font", sans-serif
    position = 0, 70
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.4)
}

# --- Center Bottom: Circular Avatar ---
image {
    monitor =
    path = /usr/share/backgrounds/aetheros/avatar.png
    size = 72
    rounding = -1
    border_size = 1
    border_color = rgba(255, 255, 255, 0.4)
    position = 0, -140
    halign = center
    valign = center
}

# --- Center Bottom: Username Label ---
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 1.0)
    font_size = 15
    font_family = Outfit SemiBold, "JetBrainsMono Nerd Font", sans-serif
    position = 0, -195
    halign = center
    valign = center
}

# --- Center Bottom: Touch ID or Enter Password Subtext ---
label {
    monitor =
    text = Touch ID or Enter Password
    color = rgba(156, 163, 175, 0.85)
    font_size = 11
    font_family = Outfit, "JetBrainsMono Nerd Font", sans-serif
    position = 0, -215
    halign = center
    valign = center
}

# --- Center Bottom: Translucent Password Input Field ---
input-field {
    monitor =
    size = 220, 36
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(249, 115, 22, 0.5)
    inner_color = rgba(10, 10, 15, 0.65)
    font_color = rgb(255, 255, 255)
    fade_on_empty = true
    placeholder_text = <span foreground="##ffffff66">Enter Password...</span>
    hide_input = false
    rounding = 18
    check_color = rgb(251, 113, 133)
    fail_color = rgb(239, 68, 68)
    fail_text = <i>Incorrect Password</i>
    fail_transition = 200
    position = 0, -255
    halign = center
    valign = center
}
