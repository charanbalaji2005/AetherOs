# /etc/calamares/modules/mount.conf - AetherOS Btrfs Subvolumes & SSD Optimizations
---
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [ bind ]

btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /var
    subvolume: /@var
  - mountPoint: /var/log
    subvolume: /@log
  - mountPoint: /.snapshots
    subvolume: /@snapshots

mountOptions:
  - filesystem: btrfs
    options: [ defaults, compress=zstd:1, noatime, space_cache=v2, ssd ]
