font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        11.0
disable_ligatures never

# Ultra-low latency terminal input & zero dropped keypresses
repaint_delay         8
input_delay           0
sync_to_monitor       yes
wayland_enable_ime    no

background_opacity   0.90
dynamic_background_opacity no
background_blur      0
window_padding_width  10

foreground            #e6f1f5
background            #0d1117
selection_foreground  #0d1117
selection_background  #56d4dd
cursor                #56d4dd
cursor_text_color     #0d1117
color0  #0d1117
color8  #4c5561
color1  #ff6b6b
color9  #ff8787
color2  #57e389
color10 #7bf1a8
color3  #f5d76e
color11 #ffe58f
color4  #56b6ff
color12 #7cc7ff
color5  #c792ea
color13 #dcb4f7
color6  #56d4dd
color14 #8be9fd
color7  #e6f1f5
color15 #ffffff

enable_audio_bell     no
confirm_os_window_close 0
scrollback_lines       10000
allow_remote_control    yes
listen_on               unix:/tmp/kitty
shell_integration       enabled

tab_bar_edge         top
tab_bar_style        powerline
tab_powerline_style  slanted
active_tab_foreground   #0d1117
active_tab_background   #56d4dd

map ctrl+shift+t        new_tab
map ctrl+shift+enter     launch --location=hsplit
map ctrl+alt+enter       launch --location=vsplit
map ctrl+shift+p         show_kitty_command_palette
map ctrl+shift+f         show_scrollback
map ctrl+shift+s         launch --type=overlay aether snapshot save
map ctrl+shift+r         launch --type=overlay aether snapshot restore
map ctrl+space           launch --type=overlay aether ai

startup_session none
