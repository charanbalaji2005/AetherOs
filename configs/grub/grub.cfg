set default="0"
set timeout=1

menuentry 'Start AetherOS 1.0 (Live Desktop - Fast Boot)' --class aetheros --class fedora --class gnu-linux --class os {
    linux /isolinux/vmlinuz root=live:CDLABEL=AETHEROS rd.live.image rw quiet splash loglevel=3 rd.systemd.show_status=auto rd.udev.log_level=3 vt.global_cursor_default=0 udev.log_priority=3 mitigations=off fastboot fsck.mode=skip bgrt.enable=1 selinux=0 enforcing=0
    initrd /isolinux/initrd.img
}

menuentry 'Start AetherOS 1.0 (Basic Graphics Mode / Safe Recovery)' --class aetheros --class fedora --class gnu-linux --class os {
    linux /isolinux/vmlinuz root=live:CDLABEL=AETHEROS rd.live.image rw nomodeset quiet selinux=0 enforcing=0
    initrd /isolinux/initrd.img
}
