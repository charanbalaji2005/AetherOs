name: Create AetherOS GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate SHA256 Checksums
        run: |
          mkdir -p release_assets
          if [ -d build/output ]; then
            find build/output/ -type f \( -name "*.iso" -o -name "*.qcow2" -o -name "*.vmdk" -o -name "*.part-*" \) -exec cp {} release_assets/ \; 2>/dev/null || true
          fi
          cd release_assets
          > SHA256SUMS.txt
          for f in *; do
            if [ -f "$f" ] && [ "$f" != "SHA256SUMS.txt" ]; then
              sha256sum "$f" >> SHA256SUMS.txt
            fi
          done
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag || github.ref_name }}
          name: AetherOS ${{ github.event.inputs.version_tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/*
            release/update-manifest-template.json
