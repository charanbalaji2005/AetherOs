[package]
name = "aether-update-engine"
version = "1.0.0"
edition = "2021"
authors = ["AetherOS Team"]
description = "AetherOS Background Update Engine D-Bus Daemon"

[dependencies]
zbus = "3.14"
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
