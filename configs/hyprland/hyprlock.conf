# AetherOS Hyprlock Configuration — macOS Glass Aesthetic

background {
    monitor =
    path = /usr/share/backgrounds/aetheros/default.png
    blur_passes = 4
    blur_size = 10
    noise = 0.015
    contrast = 0.90
    brightness = 0.80
    vibrancy = 0.20
    vibrancy_darkness = 0.1
}

# Top-Right Status & Clock (12:02 PM format)
label {
    monitor =
    text = cmd[update:1000] echo "100% 󰁹  󰤨  $(date +"%-I:%M %p")"
    color = rgba(255, 255, 255, 0.95)
    font_size = 13
    font_family = Segoe UI, Outfit, sans-serif
    position = -30, -20
    halign = right
    valign = top
}

# Center Circular Avatar
image {
    monitor =
    path = /usr/share/backgrounds/aetheros/avatar.png
    size = 96
    rounding = -1
    border_size = 2
    border_color = rgba(255, 255, 255, 0.85)
    position = 0, 70
    halign = center
    valign = center
}

# Username Label
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 1.0)
    font_size = 17
    font_family = Segoe UI Bold, Outfit Bold, sans-serif
    position = 0, 0
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.6)
}

# Translucent Pill-Shaped Password Input Field
input-field {
    monitor =
    size = 230, 38
    outline_thickness = 1
    dots_size = 0.26
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(255, 255, 255, 0.40)
    inner_color = rgba(255, 255, 255, 0.22)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff99">Enter Password</span>
    hide_input = false
    rounding = 19
    check_color = rgb(86, 212, 221)
    fail_color = rgb(255, 107, 107)
    fail_text = <i>Incorrect Password</i>
    fail_transition = 200
    position = 0, -50
    halign = center
    valign = center
}

# Bottom Center Power Actions Note
label {
    monitor =
    text = 󰤄 Sleep    󰜉 Restart    ⏻ Shut Down
    color = rgba(255, 255, 255, 0.75)
    font_size = 12
    font_family = Segoe UI, Outfit, sans-serif
    position = 0, 30
    halign = center
    valign = bottom
}
