# /etc/calamares/modules/users.conf - AetherOS User & Hostname Configuration
---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - lp
  - video
  - network
  - storage
  - name: wheel
    must_exist: false
    system: true
  - audio
  - input
  - dialout
  - systemd-journal

sudoersGroup: wheel
sudoersConfigureWithGroup: false

allowWeakPasswords: false
allowWeakPasswordsDefault: false
passwordRequirements:
  minLength: 6
  maxLength: 64

user:
  shell: /bin/bash
  forbidden_names: [ root, admin ]
  home_permissions: "o700"

hostname:
  location: EtcFile
  writeHosts: true
  template: "aether-${USER}"
