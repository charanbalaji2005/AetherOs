# /etc/sddm.conf.d/hyprland-sddm.conf
# Minimal Hyprland compositor configuration for SDDM Wayland Greeter

autogenerated = 0
env = WLR_NO_HARDWARE_CURSORS,1
monitor=,preferred,auto,1

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

animations {
    enabled = false
}
